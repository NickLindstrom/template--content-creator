name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Build static HTML
        run: npm run build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site

          cp index.html _site/

          if [ -f index.js ]; then
            cp index.js _site/
          fi

          if [ -f main.css ]; then
            cp main.css _site/
          fi

          if [ -d assets ]; then
            cp -R assets _site/
          fi

          if [ -d themes ]; then
            cp -R themes _site/
          fi

          if [ -f robots.txt ]; then
            cp robots.txt _site/
          fi

          if [ -f sitemap.xml ]; then
            cp sitemap.xml _site/
          fi

          if [ -f CNAME ]; then
            cp CNAME _site/
          fi

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4